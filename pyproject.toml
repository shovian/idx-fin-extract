[project]
name = "finx"
version = "0.1.0"
description = "Rule-based extractor for IDX financial statement PDFs (no AI at runtime)"
requires-python = ">=3.12"
dependencies = ["pymupdf>=1.26"]

[project.scripts]
finx = "finx.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
